group 'com.modizer.rewamp.rewamp_audio'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.modizer.rewamp.rewamp_audio'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        minSdk 26
        targetSdk 35
        // JNI-called Kotlin methods must survive R8 in the APP's release build.
        consumerProguardFiles 'consumer-rules.pro' 
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DREWAMP_WITH_OPENMPT=ON',
                          '-DREWAMP_WITH_VGM=ON'
                // armeabi-v7a since 2026-11-14 (box Android TV, often 32-bit
                // userland even on a 64-bit SoC). Every ABI built here MUST
                // have its FFmpeg — without it vgmstream silently loses MP3,
                // Vorbis, AAC, Opus, ATRAC, WMA, XMA…; CMakeLists.txt fails the
                // build instead. arm64/x86_64 come from ffmpeg-kit, armeabi-v7a
                // from scripts/android/build_ffmpeg_android.sh. x86 (32-bit
                // emulators only) stays out.
                abiFilters 'arm64-v8a', 'x86_64', 'armeabi-v7a'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

// FFmpeg (ffmpeg-kit prebuilt) — package the per-ABI .so into jniLibs so the
// DT_NEEDED entries linked by CMake (cmake/rewamp.cmake vgmstream block) resolve
// at runtime. arm64/x86_64 are ffmpeg-kit slices, armeabi-v7a ours
// (scripts/android/build_ffmpeg_android.sh, dir android-arm); dir names are
// remapped to Android ABI names.
def copyFfmpegLibs = tasks.register('copyFfmpegLibs', Copy) {
    def ffk = file("${projectDir}/../third_party/ffmpeg-kit")
    def abiMap = ['android-arm64': 'arm64-v8a', 'android-x86_64': 'x86_64', 'android-arm': 'armeabi-v7a']
    into "${projectDir}/src/main/jniLibs"
    abiMap.each { srcAbi, dstAbi ->
        def libDir = file("${ffk}/${srcAbi}/ffmpeg/lib")
        if (libDir.exists()) {
            from(libDir) {
                include '*.so'
                into dstAbi
            }
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn copyFfmpegLibs }
